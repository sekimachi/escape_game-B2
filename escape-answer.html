<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>答え</title>
<style>
:root{--bg:#f4efe6;--card:#fffdf8;--text:#2b2620;--sub:#8a3b2e;--line:#cdbfa6;--accent:#b8862b;--ok:#2e7d4f;--ng:#b3372c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--card:#221e17;--text:#f0e8d8;--sub:#e08a78;--line:#4a4132;--accent:#d9a441;--ok:#5fbf86;--ng:#ef7a6e}}
:root[data-theme="dark"]{--bg:#17140f;--card:#221e17;--text:#f0e8d8;--sub:#e08a78;--line:#4a4132;--accent:#d9a441;--ok:#5fbf86;--ng:#ef7a6e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:640px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:36px 32px;text-align:center}
.notice{display:inline-block;color:var(--sub);border:1px solid var(--sub);border-radius:8px;padding:8px 16px;font-size:1rem;font-weight:700;margin:0 0 28px}
.title{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:32px}
h1{font-size:2.6rem;margin:0;letter-spacing:.3em}
.key{background:none;border:none;cursor:pointer;padding:6px;border-radius:10px;line-height:0;color:var(--accent);transition:transform .15s}
.key:hover:not(:disabled){transform:rotate(-12deg) scale(1.1)}
.key:disabled{cursor:default}
.key svg,.key img{width:64px;height:64px;object-fit:contain}
.row{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:22px}
.label{font-size:1.6rem;font-weight:700;min-width:7em;text-align:right}
.cells{display:flex;gap:10px;min-width:calc(4 * 2.4em + 30px);justify-content:flex-start}
.cell{font:inherit;font-size:1.8rem;width:2.4em;height:2.4em;padding:0;text-align:center;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:10px;outline:none;text-transform:none}
.cell:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.cell:disabled{opacity:.6}
.cell.gone{display:none}
#submit{font:inherit;font-size:1.4rem;font-weight:700;margin-top:14px;padding:12px 56px;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
#submit:disabled{background:var(--line);color:var(--text);opacity:.6;cursor:not-allowed}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
.overlay.show{display:flex}
.modal{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:40px 48px;text-align:center;max-width:420px;width:100%}
.modal h2{font-size:2.2rem;margin:0 0 12px}
.modal.ok h2{color:var(--ok)}.modal.ng h2{color:var(--ng)}
.modal p{margin:0 0 24px;font-size:1.1rem}
.modal button{font:inherit;font-size:1.1rem;padding:8px 32px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
@media (max-width:520px){.row{flex-direction:column;gap:8px}.label{text-align:center}}
</style>
</head>
<body>
<main>
  <p class="notice">⚠ 入力できるのは一回だけです</p>
  <div class="title">
    <h1>答え</h1>
    <button class="key" id="keyBtn" type="button" aria-label="鍵">
      <img src="bottom.png" alt="鍵" id="keyImg">
      <svg id="keyFallback" style="display:none" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="18" cy="32" r="11"/><circle cx="18" cy="32" r="3.5" fill="currentColor"/>
        <path d="M29 32h29M48 32v10M56 32v7"/>
      </svg>
    </button>
  </div>
  <div class="row"><span class="label">USB</span>
    <div class="cells" id="usbCells"><input class="cell" maxlength="2" autocomplete="off" inputmode="numeric" aria-label="USB"></div></div>
  <div class="row"><span class="label">パスワード</span>
    <div class="cells" id="pwCells">
      <input class="cell" maxlength="2" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="パスワード1文字目">
      <input class="cell" maxlength="2" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="パスワード2文字目">
      <input class="cell" maxlength="2" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="パスワード3文字目">
      <input class="cell" maxlength="2" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="パスワード4文字目" id="pw4">
    </div></div>
  <button id="submit" type="button" disabled>確定</button>
</main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <h2 id="mTitle"></h2><p id="mText"></p>
    <button type="button" id="closeBtn">閉じる</button>
  </div>
</div>

<script>
const submit=document.getElementById('submit'), keyBtn=document.getElementById('keyBtn'),
      overlay=document.getElementById('overlay'), modal=document.getElementById('modal'),
      pw4=document.getElementById('pw4');
const usbCells=[...document.querySelectorAll('#usbCells .cell')];
const pwCells=[...document.querySelectorAll('#pwCells .cell')];
const allCells=[...usbCells,...pwCells];
let done=false;

const norm=s=>s.normalize('NFKC').trim().toLowerCase();
const active=g=>g.filter(c=>!c.classList.contains('gone'));
const valueOf=g=>active(g).map(c=>c.value).join('');

function update(){
  submit.disabled = done || allCells.some(c=>!c.classList.contains('gone') && c.value==='');
}

allCells.forEach(cell=>{
  const group=usbCells.includes(cell)?usbCells:pwCells;
  cell.addEventListener('input',e=>{
    if(e.isComposing) return;
    fill(cell,group);
  });
  cell.addEventListener('compositionend',()=>fill(cell,group));
  cell.addEventListener('keydown',e=>{
    const list=active(group), i=list.indexOf(cell);
    if(e.key==='Backspace' && cell.value==='' && i>0){ list[i-1].value=''; list[i-1].focus(); update(); e.preventDefault(); }
    else if(e.key==='ArrowLeft' && i>0){ list[i-1].focus(); }
    else if(e.key==='ArrowRight' && i<list.length-1){ list[i+1].focus(); }
  });
  cell.addEventListener('focus',()=>cell.select());
});

// 入力された文字を1文字ずつ各ボックスに振り分ける(貼り付けにも対応)
function fill(cell,group){
  const chars=[...cell.value.normalize('NFKC')].filter(ch=>ch.trim()!=='');
  const list=active(group);
  let i=list.indexOf(cell);
  cell.value='';
  for(const ch of chars){
    if(i>=list.length) break;
    list[i].value=ch; i++;
  }
  const next=list[Math.min(i,list.length-1)];
  if(next) next.focus();
  update();
}

keyBtn.addEventListener('click',()=>{
  if(done) return;
  pw4.value='';
  pw4.classList.add('gone');
  update();
});

// 画像が読み込めない場合は代替アイコンを表示
document.getElementById('keyImg').addEventListener('error',function(){
  this.style.display='none';
  document.getElementById('keyFallback').style.display='block';
});

submit.addEventListener('click',()=>{
  if(submit.disabled) return;
  done=true;
  [...allCells,submit,keyBtn].forEach(e=>e.disabled=true);
  const ok = norm(valueOf(usbCells))==='6' && norm(valueOf(pwCells))==='leg';
  modal.className='modal '+(ok?'ok':'ng');
  document.getElementById('mTitle').textContent = ok?'正解!':'間違っています';
  document.getElementById('mText').textContent = ok?'おめでとうございます!':'残念ながら不正解です。';
  overlay.classList.add('show');
});
document.getElementById('closeBtn').addEventListener('click',()=>overlay.classList.remove('show'));
</script>
</body>
</html>
